name: Mission Zero checks
on:
  push:
    branches: [main, mission-zero-complete-build]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:api
      - run: npm run build
